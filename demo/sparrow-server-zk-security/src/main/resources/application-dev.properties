server.port=8601

spring.jpa.show-sql=true
#data source configuration
spring.datasource.url=jdbc:mysql://localhost/chnplc2?useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#hibernate configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.properties.hibernate.provider=org.hibernate.jpa.HibernatePersistenceProvider
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.hbm2ddl.auto=update
#spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.datasource.tomcat.testOnBorrow=true 
spring.datasource.tomcat.validationQuery=SELECT 1
spring.jpa.properties.org.hibernate.envers.audit_table_prefix=au_
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
#spring.jpa.properties.org.hibernate.flushMode=COMMIT
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
# keycloak security setup
keycloak.auth-server-url=http://localhost:7980
keycloak.realm=master
keycloak.resource=project-service
keycloak.credentials.secret=boE6PccqFes0ar7G5KRrC06rm3GhIv5b
#keycloak.public-client=true
keycloak.principal-attribute=preferred_username
keycloak.bearer-only=true
