spring.application.name=sparrow-admin
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${SPARROW_DATABASE_URL}
spring.datasource.username=${SPARROW_DATABASE_USERNAME}
spring.datasource.password=${SPARROW_DATABASE_PASSWORD}
sparrow.storage.local.root=${SPARROW_STORAGE_ROOT}
sparrow.management.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
