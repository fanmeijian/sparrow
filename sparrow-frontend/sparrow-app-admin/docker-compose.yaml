version: "3"
services:
  dengbo-admin:
    image: sparrow-app-admin:1.0
    container_name: sport-app-admin
    ports:
      - "8202:80"
    environment:
      - API_BASE=http://localhost:8601/chnplc-service
      - PEM_BASE=http://localhost:8601/chnplc-service
      - REALM=chnplc
      - CLIENT_ID=chnplc-web
      - KEYCLOAK_API_BASE=https://keycloak.linkair-tech.cn
